name: Explorer, gateway, tools

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - "rpc-gateway/**"
      - "tools/**"
      - "compose.yaml"
      - "compose.live.yaml"
      - ".github/workflows/explorer.yml"
  pull_request:
    branches: [main]
    paths:
      - "explorer/**"
      - "rpc-gateway/**"
      - "tools/**"
      - "compose.yaml"
      - "compose.live.yaml"
      - ".github/workflows/explorer.yml"

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [explorer/backend, rpc-gateway, tools/chain-fingerprint]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # typecheck + vite build + static meta + CSP hashes
      - run: bun run build

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config --quiet
      - run: |
          mkdir -p secrets && touch secrets/signer.key
          docker compose -f compose.yaml -f compose.live.yaml config --quiet
      - run: docker compose -f explorer/compose.yaml config --quiet
