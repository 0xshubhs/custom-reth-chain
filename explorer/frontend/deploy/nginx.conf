# -----------------------------------------------------------------------------
# nginx: the explorer website served by a host nginx, without the container
#
# Two uses:
#
#   1. The SOURCE of the Content-Security-Policy. The Dockerfile reads the
#      `set $csp` lines below at image build time and turns them into the
#      explorer-web container's one Content-Security-Policy header, so these
#      lines ARE the production policy, whichever way you serve the site.
#   2. A reference for serving dist/ straight from a host nginx: security
#      headers, /api/* to the explorer API, and an unbuffered location for the
#      live block feed /api/v2/stream (server-sent events).
#
# With docker compose you do not need this file on the host: point your TLS
# proxy at explorer-web (127.0.0.1:3000), which already does all of the above.
#
# READ THIS BEFORE ADDING ANY add_header TO A location BLOCK: nginx's
# add_header inheritance is all-or-nothing per level. A location that defines
# even one add_header of its own drops EVERY add_header inherited from the
# server block. Per-path Cache-Control therefore comes from the `map` below and
# is set once at server level.
#
# Assumes: the site built to /var/www/explorer/dist, the API on 127.0.0.1:4000
# (EXPLORER_API_PORT in .env).
# -----------------------------------------------------------------------------

upstream explorer_engine {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Per-path Cache-Control, evaluated once and applied at server level. An empty
# value adds no header, so /api/ responses keep the engine's own.
map $uri $explorer_cache_control {
    ~^/api/                                            "";
    ~^/assets/                                         "public, max-age=31536000, immutable";
    ~*\.(?:svg|png|jpg|jpeg|webp|ico|woff|woff2|ttf)$  "public, max-age=86400, stale-while-revalidate=604800";
    default                                            "no-cache, no-store, must-revalidate";
}

server {
    listen 443 ssl http2;
    server_name localhost;

    # ssl_certificate / ssl_certificate_key managed by certbot.

    root /var/www/explorer/dist;
    index index.html;

    # Security headers. `always` so they are on error responses too.
    add_header X-Frame-Options            "DENY"                            always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"        always;
    add_header Cache-Control              $explorer_cache_control always;

    # Content-Security-Policy, one directive per `set` line. Never use a
    # trailing-backslash continuation inside a quoted string: nginx turns it
    # into a literal newline in the header value, which truncates the header
    # block there.
    #
    # The site needs very little:
    #   script-src  'self' only. No inline script anywhere: the theme bootstrap
    #               is public/theme-boot.js, and scripts/csp-hash.mjs fails the
    #               build if an inline script appears.
    #   style-src   'unsafe-inline' for React style attributes (progress bars)
    #               and the <style> sonner injects for its toasts.
    #   connect-src 'self' only. Every request goes to this origin's /api/,
    #               the read-contract form included (the engine does the
    #               eth_call). "Add network to MetaMask" talks to the wallet
    #               extension through window.ethereum, which the page CSP does
    #               not govern, so the public RPC needs no allowance here.
    #   img-src     data: for the small inline SVG data URIs Tailwind emits.
    set $csp "default-src 'self'";
    set $csp "$csp; script-src 'self'";
    set $csp "$csp; style-src 'self' 'unsafe-inline'";
    set $csp "$csp; font-src 'self'";
    set $csp "$csp; img-src 'self' data:";
    set $csp "$csp; connect-src 'self'";
    set $csp "$csp; worker-src 'none'";
    set $csp "$csp; object-src 'none'";
    set $csp "$csp; base-uri 'self'";
    set $csp "$csp; form-action 'self'";
    set $csp "$csp; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;

    # Live block feed (SSE). Must not be buffered or every event waits for a
    # buffer to fill. Exact match, so it wins over the /api/ prefix below.
    location = /api/v2/stream {
        proxy_pass http://explorer_engine;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
    }

    # Contract verification uploads a standard JSON input: the verifier takes
    # up to MAX_INPUT_BYTES (20 MiB), so the proxy allows a little more and
    # the engine stays the binding limit (it answers with a JSON message).
    location ~ ^/api/v2/smart-contracts/[^/]+/verification/ {
        proxy_pass http://explorer_engine;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        client_max_body_size 24m;
        proxy_read_timeout   60s;
    }

    # REST API. No add_header here on purpose: the server-level set is
    # inherited and the map leaves the engine's Cache-Control alone.
    location /api/ {
        proxy_pass http://explorer_engine;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    # Vite content-hashes everything under /assets, so it is cached forever
    # (the immutable Cache-Control comes from the map).
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Non-hashed files from public/ (icons, logo): one day, then revalidate.
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
    }

    # Source maps must not be publicly readable.
    location ~* \.map$ {
        deny all;
    }

    # SPA fallback: /tx/<hash>, /address/<addr>, /block/<n> and the rest are
    # client routes and must return index.html on a hard refresh. index.html is
    # never cached (the map's default), so a deploy is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
