# nginx inside the explorer-web container: serves the built website and
# proxies /api/ to the explorer API. TLS and your domain names belong to the
# reverse proxy in front of it (deploy/nginx.conf is a reference for that).
#
# Placeholders filled in by the Dockerfile:
#   __ENGINE_UPSTREAM__   the API service (host:port), API_UPSTREAM build arg
#   /etc/nginx/csp.conf   the Content-Security-Policy, taken from the `set $csp`
#                         lines of deploy/nginx.conf at build time. Keep the
#                         policy there: a second CSP header here would make
#                         browsers apply both.

# http-level directives (conf.d/*.conf is included into the http block).
log_format fwd '$http_x_forwarded_for - $remote_user [$time_local] '
               '"$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" rt=$request_time';
log_format csp escape=json 'csp-report [$time_local] page="$http_referer" '
                           'ua="$http_user_agent" report=$request_body';

# Behind a reverse proxy every client arrives as the proxy; trust its X-Real-IP.
map $http_x_real_ip $client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout fwd;
    error_log  /dev/stderr warn;

    # Source maps are deleted at build time; never serve one that slips in.
    location ~* \.map$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405;
        }
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml application/wasm;

    # Hashed build output: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        location ~* \.mjs$ {
            types { application/javascript mjs; }
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options            "DENY"                            always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"        always;
        include /etc/nginx/csp.conf;
    }

    # Docker's DNS, so the API can be restarted (new IP) without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The live block feed (server-sent events): unbuffered, long-lived.
    location = /api/v2/stream {
        set $engine __ENGINE_UPSTREAM__;
        proxy_pass http://$engine;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        set $engine __ENGINE_UPSTREAM__;
        proxy_pass http://$engine;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        # Contract verification uploads (standard JSON input) can be large.
        client_max_body_size 24m;
        proxy_read_timeout   120s;
    }

    # CSP violation reports land in this container's log as one JSON line each.
    location = /csp-report {
        limit_except POST { deny all; }
        client_max_body_size    64k;
        client_body_buffer_size 64k;
        access_log /dev/stdout csp;
        proxy_pass http://127.0.0.1:8080/csp-report-sink;
    }
    location = /csp-report-sink {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri $uri/ @spa;
        add_header X-Frame-Options            "DENY"                            always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"        always;
        include /etc/nginx/csp.conf;
    }

    # Client-side routes get index.html; a missing file (has an extension) is a 404.
    location @spa {
        add_header X-Content-Type-Options "nosniff" always;
        if ($uri ~ "/\.|\.[^/]*$") {
            return 404;
        }
        rewrite ^ /index.html last;
    }
}
